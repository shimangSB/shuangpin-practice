<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打赏支持 · 双拼练习</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #1f2430;
      --muted: #6b7280;
      --line: #e5e9f2;
      --accent: #4f6ef7;
      --accent-2: #7c5cf0;
      --green: #07c160;
      --blue: #1677ff;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 16px 40px rgba(16, 24, 40, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #e7ecff 0%, transparent 55%),
        radial-gradient(1000px 500px at 100% 0%, #f3e9ff 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap { width: 100%; max-width: 860px; text-align: center; }

    .hero { margin-bottom: 34px; }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: linear-gradient(120deg, #4f6ef7, #7c5cf0);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .hero h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: 1px; }
    .hero p { margin: 0; color: var(--muted); font-size: 16px; }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 24px 56px rgba(16, 24, 40, .14); }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .card-head .icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .card-head .icon.wx { background: #e6f9ee; }
    .card-head .icon.ali { background: #e8f1ff; }
    .card-head h2 { margin: 0; font-size: 19px; }

    .qr {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      cursor: zoom-in;
      border: 1px solid var(--line);
    }
    .tip { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
    .tip b { color: var(--ink); }

    .footnote { margin: 30px 0 0; color: var(--muted); font-size: 14px; }
    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      transition: .15s;
    }
    .back:hover { border-color: var(--accent); }

    /* 放大查看 */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(15, 20, 32, .82);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: min(92vw, 560px);
      max-height: 88vh;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
    }
    .lightbox .close {
      position: absolute; top: 18px; right: 22px;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .hero h1 { font-size: 27px; }
      .qr { max-height: 340px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="badge">❤️ 支持作者</div>
      <h1>感谢你的支持</h1>
      <p>如果「双拼练习」帮助到了你，欢迎请我喝杯咖啡 ☕</p>
    </header>

    <div class="cards">
      <section class="card">
        <div class="card-head">
          <span class="icon wx">💚</span>
          <h2>微信打赏</h2>
        </div>
        <img class="qr" src="donate/wechat.jpg" alt="微信收款码" />
        <p class="tip">打开微信「扫一扫」<b>识别二维码</b></p>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="icon ali">💙</span>
          <h2>支付宝打赏</h2>
        </div>
        <img class="qr" src="donate/alipay.png" alt="支付宝收款码" />
        <p class="tip">打开支付宝「扫一扫」<b>识别二维码</b></p>
      </section>
    </div>

    <p class="footnote">扫码后可在备注里留下你的昵称，我会记得你 ❤️</p>
    <a class="back" href="index.html">← 返回双拼练习</a>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="close" id="lbClose" aria-label="关闭">×</button>
    <img id="lbImg" src="" alt="收款码放大图" />
  </div>

  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lbImg');
      var qrs = document.querySelectorAll('.qr');
      for (var i = 0; i < qrs.length; i++) {
        qrs[i].addEventListener('click', function () {
          img.src = this.src;
          box.classList.add('open');
        });
      }
      function close() { box.classList.remove('open'); }
      document.getElementById('lbClose').addEventListener('click', function (e) { e.stopPropagation(); close(); });
      box.addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();
  </script>
</body>
</html>
